name: Native wallet

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: node tools/check-native-model.mjs

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-15-intel
            bundle: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libdbus-1-dev
      - run: npm ci
      - run: node --test tools/native-host.test.mjs
      - run: node tools/native-build.mjs icons
      - run: npm run native:frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
      - run: node tools/native-build.mjs desktop build --debug --bundles ${{ matrix.bundle }} ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
      - name: Verify universal macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle_path='src-tauri/target/universal-apple-darwin/debug/bundle/macos/Shielded.app'
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle_path/Contents/Info.plist")
          lipo "$bundle_path/Contents/MacOS/$executable" -verify_arch arm64 x86_64

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Select installed Android NDK
        shell: bash
        run: |
          ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run native:android -- init --ci --skip-targets-install
      - run: npm run native:android -- build --debug --apk --target aarch64 --ci

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Select simulator architecture
        shell: bash
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then
            echo 'IOS_TARGET=aarch64-sim' >> "$GITHUB_ENV"
            rustup target add aarch64-apple-ios-sim
          else
            echo 'IOS_TARGET=x86_64' >> "$GITHUB_ENV"
            rustup target add x86_64-apple-ios
          fi
      - run: npm ci
      - run: npm run native:ios -- init --ci --skip-targets-install
      - run: npm run native:ios -- build --debug --target "$IOS_TARGET" --no-sign --ci
      - name: Run macOS ARM workspace tests
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked --target aarch64-apple-darwin
