name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: tools/vm/go.sum
      - run: npm ci
      - run: npm run vm:build
      - run: go test ./...
        working-directory: tools/vm
      - run: npm test
      - run: npm run build
  rollup-circuits:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: .deps
          key: rollup-circom-2.2.2-linux-compiler-e976b5e8
      - run: npm ci
      - run: npm run circom
      - run: npm run rollup:compile
      - run: npm run test:rollup:witness
  dokploy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --file Dockerfile.dokploy --tag shielded-dokploy:ci .
      - run: docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL shielded-dokploy:ci bin/shielded-vm -info
      - run: docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL shielded-dokploy:ci node -e "for(const f of ['src/server.ts','bin/rapidsnark','rollup-keys/manifest.json','rollup-keys/batch-join.zkey','app/dist/index.html'])require('fs').accessSync(f)"
