name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: tools/vm/go.sum
      - run: npm ci
      - run: npm run vm:build
      - run: go test ./...
        working-directory: tools/vm
      - run: npm test
      - run: npm run build
      - run: npm run sdk:build
  epoch-circuits:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps
          key: rollup-circom-2.2.2-linux-compiler-e976b5e8
      - run: npm ci
      - run: npm run circom
      - run: npm run rollup:compile:epoch
      - run: npm run rollup:budget:epoch
      - run: npm run test:rollup:epoch-witness
  dokploy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pull base images through mirror.gcr.io (shared runner IPs hit Docker Hub's anonymous rate limit)
        run: |
          sudo sh -c 'f=/etc/docker/daemon.json; [ -s $f ] || echo "{}" > $f; jq ". + {\"registry-mirrors\": [\"https://mirror.gcr.io\"]}" $f > /tmp/daemon.json && mv /tmp/daemon.json $f'
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'
      - run: docker build --file Dockerfile.dokploy --tag shielded-dokploy:ci .
      - run: docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL shielded-dokploy:ci bin/shielded-vm -info
      - run: docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL shielded-dokploy:ci node -e "for(const f of ['src/server.ts','bin/rapidsnark','rollup-keys/manifest.json','rollup-keys/epoch-batch-join.zkey','app/dist/index.html'])require('fs').accessSync(f)"
