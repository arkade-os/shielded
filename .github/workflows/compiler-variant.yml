name: Compiler variant
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compiler-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arkade-os/compiler
          ref: 89a1ff73b24441699095c9135d6429f7dc6cb6ab
          path: .deps/compiler
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: tools/vm/go.sum
      - name: Build pinned compiler and exercise compiled leaves
        run: npm run test:compiler
        env:
          SHIELDED_COMPILER_SOURCE: .deps/compiler
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compiler-vectors-${{ github.sha }}
          path: .recovery/compiler-variant/vectors
          if-no-files-found: error
