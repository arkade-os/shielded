name: Pin native build runtimes
description: Install the pinned Node and Rust runtimes used for native releases
inputs:
  rust-target:
    description: Optional Rust target
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.22.2'
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: '1.96.0'
        targets: ${{ inputs.rust-target }}
