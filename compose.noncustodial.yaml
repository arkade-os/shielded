services:
  shielded-public-lab:
    build:
      context: .
      dockerfile: Dockerfile.noncustodial
    image: shielded-noncustodial:local
    init: true
    read_only: true
    stop_grace_period: 2m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m,mode=1777]
    ports: ["127.0.0.1:8789:8789"]
    environment:
      SHIELDED_API_TOKEN: ${SHIELDED_API_TOKEN:?Set a separate lab token of at least 32 characters}
    volumes: [shielded-public-lab-data:/data]
volumes:
  shielded-public-lab-data:
