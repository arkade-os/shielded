[package]
name = "shielded-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[lib]
name = "shielded_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["plugins/shielded-platform"]
exclude = ["vendor/sysinfo"]
resolver = "3"

[patch.crates-io]
sysinfo = { path = "vendor/sysinfo" }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
arti-client = { version = "=0.48.0", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite", "experimental-api"] }
base64 = "=0.23.1"
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", features = ["sink"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-shielded-platform = { path = "plugins/shielded-platform" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tor-rtcompat = { version = "=0.48.0", default-features = false, features = ["tokio", "rustls"] }
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4"] }
webpki-roots = "=1.0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
