services:
  shielded:
    build: .
    image: shielded-poc:local
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    ports:
      - "127.0.0.1:${SHIELDED_BIND_PORT:-8787}:8787"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8787
      - SHIELDED_NETWORK=${SHIELDED_NETWORK:-mutinynet}
      - SHIELDED_PROOF_TRANSPORT=${SHIELDED_PROOF_TRANSPORT:-inline}
      - SHIELDED_DATA_DIR=/data
      - SHIELDED_API_TOKEN=${SHIELDED_API_TOKEN:?Set SHIELDED_API_TOKEN to a random value of at least 32 characters}
      - ARK_SERVER_URL=${ARK_SERVER_URL:-https://mutinynet.arkade.sh}
      - EMULATOR_URL=${EMULATOR_URL:-https://emulator.mutinynet.arkade.sh}
      - SHIELDED_STORAGE_KEY
    volumes:
      - shielded-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  shielded-data:
