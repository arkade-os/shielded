[package]
name = "tauri-plugin-shielded-platform"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-shielded-platform"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"
zeroize = "1"
base64 = "=0.23.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
futures-channel = "=0.3.34"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSData", "NSString", "NSError", "NSObject", "NSProcessInfo"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow", "NSResponder"] }
objc2-authentication-services = { version = "=0.3.2", default-features = false, features = ["std", "ASAuthorization", "ASAuthorizationController", "ASAuthorizationCredential", "ASAuthorizationRequest", "ASAuthorizationError", "ASAuthorizationPlatformPublicKeyCredentialProvider", "ASAuthorizationPlatformPublicKeyCredentialRegistrationRequest", "ASAuthorizationPlatformPublicKeyCredentialRegistration", "ASAuthorizationPlatformPublicKeyCredentialAssertionRequest", "ASAuthorizationPlatformPublicKeyCredentialAssertion", "ASAuthorizationPlatformPublicKeyCredentialDescriptor", "ASAuthorizationPublicKeyCredentialRegistration", "ASAuthorizationPublicKeyCredentialRegistrationRequest", "ASAuthorizationPublicKeyCredentialAssertion", "ASAuthorizationPublicKeyCredentialAssertionRequest", "ASAuthorizationPublicKeyCredentialConstants", "ASPublicKeyCredential", "ASAuthorizationPublicKeyCredentialDescriptor", "ASAuthorizationPublicKeyCredentialPRFRegistrationInput", "ASAuthorizationPublicKeyCredentialPRFRegistrationOutput", "ASAuthorizationPublicKeyCredentialPRFAssertionInput", "ASAuthorizationPublicKeyCredentialPRFAssertionOutput", "ASFoundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
zbus = { version = "=4.4.0", default-features = false, features = ["tokio"] }
futures-util = "=0.3.34"
tokio = { version = "=1.54.1", features = ["time"] }
uuid = { version = "=1.29.0", features = ["v4"] }
