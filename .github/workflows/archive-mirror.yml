name: Archive mirror
# Schedules fire only from the default branch and GitHub pauses them after a quiet spell; workflow_dispatch runs it by hand while the workflow is enabled.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: archive-mirror
env:
  POOL_URL: https://shielded.mutinynet.arkade.sh
  RELEASE_TAG: rollup-genesis-4-archives
jobs:
  # Runs the repository's npm dependencies, so it holds no write token; the release job runs only Node's standard library.
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mirrored: ${{ steps.mirror.outcome }}
      archives: ${{ steps.archives.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Writes each archive only once it rebuilds the root its mirrored records replay to; one refusal does not hold back the rest.
      - name: Mirror the pool's records and the archives they check
        id: mirror
        continue-on-error: true
        run: node --import tsx tools/rollup-fallback.ts mirror --no-keys "$POOL_URL" "$RUNNER_TEMP/mirror"
      - name: Check the mirrored records against the chain
        run: node --import tsx tools/rollup-fallback.ts check "$RUNNER_TEMP/mirror"
      - id: archives
        uses: actions/upload-artifact@v4
        with:
          name: archives
          path: ${{ runner.temp }}/mirror/nullifiers/epoch-*.nf
          if-no-files-found: ignore
          retention-days: 1
  release:
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - if: needs.mirror.outputs.archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, pinned: this job holds the write token
        with:
          name: archives
          path: archives
      - name: Upload the checked archives the release lacks or holds differently
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {existsSync, readdirSync, readFileSync} from 'node:fs';

          const {POOL_URL, RELEASE_TAG} = process.env;
          const gh = (...args) => {
            const {status, stdout, stderr, error} = spawnSync('gh', args, {encoding: 'utf8'});
            if (status !== 0) throw new Error(`gh ${args.slice(0, 2).join(' ')}: ${stderr?.trim() || error}`);
            return stdout;
          };

          const names = existsSync('archives') ? readdirSync('archives').filter(name => /^epoch-(0|[1-9]\d*)\.nf$/.test(name)) : [];
          if (!names.length) {
            console.log('No closed epoch has a checked archive yet; nothing to upload.');
            process.exit(0);
          }
          let assets;
          try {
            assets = JSON.parse(gh('release', 'view', RELEASE_TAG, '--json', 'assets')).assets;
          } catch (error) {
            if (!/release not found/.test(error.message)) throw error;
            gh('release', 'create', RELEASE_TAG, '--latest=false', '--title', 'Rollup genesis-4 nullifier archives (Mutinynet, epoch pool)', '--notes', `Copies of the closed epochs' nullifier archives served at ${POOL_URL}/api/rollup/archives, each uploaded only after it rebuilt the root that pool records bound to the chain replay to. Each reader still checks a file against its own epoch root.`);
            assets = [];
          }
          for (const name of names) {
            const bytes = readFileSync(`archives/${name}`), digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
            // A failed upload can leave a half-open asset under the name; --clobber replaces it.
            const held = assets.find(a => a.name === name && a.state === 'uploaded');
            if (held?.digest === digest) continue;
            try {
              gh('release', 'upload', RELEASE_TAG, `archives/${name}`, '--clobber');
              console.log(held ? `::warning::Replaced ${name}: the release held ${held.digest ?? 'a copy with no digest'}, not the checked ${digest}.` : `Uploaded ${name} (${bytes.length} bytes).`);
            } catch (error) {
              console.log(`::error::${error.message.split(/[\r\n]/)[0]}`);
              process.exitCode = 1;
            }
          }
          JS
      - name: Fail the run when the mirror refused anything
        if: needs.mirror.outputs.mirrored == 'failure'
        run: |
          echo '::error::The mirror step failed; its log in the mirror job names what it refused.'
          exit 1
